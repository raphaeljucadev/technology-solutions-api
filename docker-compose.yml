version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-laravel
    volumes:
      - ./api/public:/var/www/public
      - ./api/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mynetwork
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./api
    image: laravel-app
    container_name: laravel-backend
    volumes:
      - ./api:/var/www
    networks:
      - mynetwork
    depends_on:
      - db
      - redis
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=technology_solutions_db
      - DB_USERNAME=root
      - DB_PASSWORD=secret  # Defina a senha aqui
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=reidopython@gmail.com
      - MAIL_PASSWORD=nsrliurxswoweclg
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=reidopython@gmail.com
      - MAIL_FROM_NAME="Seu Nome ou Empresa"
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  db:
    image: mysql:5.7
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: secret  # Defina a senha aqui
      MYSQL_DATABASE: technology_solutions_db
    networks:
      - mynetwork
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./api/technology_solutions_db.sql:/docker-entrypoint-initdb.d/technology_solutions_db.sql

  redis:
    image: redis:alpine
    container_name: redis-laravel
    networks:
      - mynetwork
    ports:
      - "6379:6379"

  scheduler:
    build:
      context: ./api
    container_name: laravel-scheduler
    command: php /var/www/artisan schedule:work
    volumes:
      - ./api:/var/www
    depends_on:
      - backend
      - redis
    networks:
      - mynetwork

  queue:
    build:
      context: ./api
    container_name: laravel-queue
    command: php /var/www/artisan queue:work --queue=convites
    volumes:
      - ./api:/var/www
    depends_on:
      - backend
      - redis
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge

volumes:
  db_data:
